# HindiBabyNet configuration
#
# 1. Copy this file and rename the copy to config.yaml.
#    config.yaml stays on your computer. It is not uploaded to GitHub.
# 2. Change raw_audio to the folder with your audio recordings.

# Main data folder. The prepared audio and all results are saved here.
data_dir: ../HindiBabyNet-data

paths:
  # Folder with your audio recordings (WAV files).
  # Windows: D:/my_recordings    Ubuntu: /home/yourname/my_recordings
  raw_audio: D:/my_recordings

  # All other folders have a default place inside data_dir:
  #
  #   derived/prepared-audio/        prepared WAV files
  #   derived/vtc-classification/    VTC results
  #   derived/xgb-classification/    XGBoost results
  #   derived/textgrids/             Praat TextGrid files (optional)
  #   derived/manual-annotations/    manual speaker labels (optional)
  #   cache/                         temporary files
  #
  # To save a folder in another place, remove the "#" and write your path.
  # prepared_audio: D:/my_data/prepared-audio
  # vtc: D:/my_data/vtc-classification
  # xgb: D:/my_data/xgb-classification
  # textgrids: D:/my_data/textgrids
  # annotations: D:/my_data/manual-annotations
  # cache: D:/my_data/cache

  # Only needed to reproduce the HindiBabyNet research results
  # (CDI, prosody and statistical analysis):
  #
  #   raw/cdi/                       CDI questionnaire exports and word_mapping.csv
  #   raw/metadata/                  metadata_cleaned.xlsx, participant_lookup.csv
  #   derived/prosody-features/      prosodic features
  #   derived/statistical-data/      datasets for the audio statistics
  #   results/                       tables, figures and reports
  #
  # raw_cdi: D:/my_data/cdi
  # word_mapping: D:/my_data/cdi/word_mapping.csv
  # metadata: D:/my_data/metadata
  # prosody_features: D:/my_data/prosody-features
  # statistical_data: D:/my_data/statistical-data
  # results: D:/my_data/results

# Speaker classification with VTC (runs in Ubuntu).
audio:
  vtc_repo: ~/VTC      # folder where VTC is installed
  vtc_device: cpu      # cpu or cuda
