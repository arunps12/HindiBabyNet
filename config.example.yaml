# NEW STUDY EXAMPLE, not a migration of the current study's local configuration.
# Copy to a NEW ignored local YAML beside this file; never replace an existing
# config.local.yaml. Supply authorized inputs/dependencies, review science and
# enable only the workflows needed. No private inputs or model weights ship here.
# For an existing study, configure snapshots approved native mappings instead;
# this example deliberately uses fresh locations, not the current active paths.
# All project_root values resolve from THIS YAML's directory (repository root).
# Workflow project values locate CODE only; scientific paths are explicit below.
# Keep Data inputs, results, linkage/contact files and .local caches private.
# Choose unoccupied results AND cache/log/artifact roots before a new analysis;
# these example destinations are not guaranteed empty on an existing machine.
tools:
  uv: uv
  rscript: Rscript

workflows:
  audio:
    enabled: false
    project: audio
  vocal-stats:
    enabled: false
    project: vocal_stats
  prosody:
    enabled: false
    project: prosody
  vocal-models:
    enabled: false
    project: vocal_stats
  prosody-stats:
    enabled: false
    project: prosody_stats
  cdi:
    enabled: false
    project: cdi

# Native runtime mapping; prepared audio and RTTM must share the same timebase.
audio:
  project_root: "."
  artifacts_root: results/audio/artifacts/runs
  logs_root: results/audio/logs
  paths:
    raw_audio_root: Data/raw_audio
    raw_joined_audio_root: results/audio/raw_joined_audio
    prepared_audio_root: results/audio/prepared_audio
    classification_output_root: results/audio/classification
    textgrid_output_root: results/audio/textgrids
    manual_annotation_root: results/audio/manual_annotations
    evaluation_output_root: results/audio/evaluation
  data_ingestion:
    allowed_ext: [".wav", ".WAV"]
    session_selection: earliest
    recordings_filename: recordings.parquet
  audio_preparation:
    save_raw_joined_audio: true
    save_prepared_audio: true
  speaker_classification:
    backend: vtc
    output_root: results/audio/classification
    xgb:
      # Optional alternative backend; never substitute for downstream VTC inputs.
      model_path: Data/models/xgb_egemaps.pkl
    vtc:
      # Install the external VTC checkout, weights and its own environment here.
      # Windows/WSL execution still requires the native backend prerequisites.
      repo_path: .local/cache/external_models/VTC
      device: cpu
      # Active runtime 128 overrides params 32 below; preserve BOTH originals.
      batch_size: 128
      keep_inputs: false

# Full native params mapping, unchanged values (separate runtime precedence).
audio_params:
  project_root: "."
  audio_preparation:
    join_multiple_files: true
    combine_gap_sec: 0.0
    resample: true
    target_sr: 16000
    convert_to_mono: true
    normalize: true
    target_peak_dbfs: -1.0
  xgb:
    class_names: [adult_male, adult_female, child, background]
    egemaps_dim: 88
    vad:
      aggressiveness: 2
      frame_ms: 30
      min_region_ms: 300
    diarization:
      model: pyannote/speaker-diarization-3.1
      chunk_sec: 900.0
      overlap_sec: 10.0
      min_speakers: 2
      max_speakers: 4
    segmentation:
      merge_gap_sec: 0.3
      min_segment_sec: 0.2
    classification:
      win_sec: 1.0
      hop_sec: 0.5
  vtc:
    batch_size: 32
  annotation:
    n_segments_per_participant: 50
    random_seed: 42
    labels:
      adult_female: 1
      adult_male: 2
      key_child: 3
      other_child: 4
      unclear: 5
      noise: 6
  textgrid:
    tiers: [adult_female, adult_male, key_child, other_child]

# Vocal preprocessing and vocal-models R share this native path mapping.
# R model defaults/HBN_* overrides remain native; YAML is not an R model spec.
vocal:
  project_root: "."
  metadata_path: Data/metadata/metadata.xlsx
  # Raw sessions retain the native duration denominator, not prepared audio.
  audio_root: Data/raw_audio
  # VTCBackend.name is lowercase "vtc" (not the older asset folder "VTC").
  vtc_output_root: results/audio/classification/vtc
  derived_data_dir: results/vocal_stats/derived
  private_data_dir: results/vocal_stats/private
  figures_dir: results/vocal_stats/figures
  tables_dir: results/vocal_stats/tables
  results_dir: results/vocal_stats
  metadata_id_column: par_id
  recording_duration_source: raw_audio_sessions
  session_selection: earliest
  session_date_format: "%Y%m%d"
  audio_layout:
    type: participant_folder
    participant_folder_name: "{par_id}"
    recursive: true
    audio_extensions: [".wav", ".WAV", ".flac", ".FLAC"]
    expected_audio_files: auto
    prefer_largest_audio_file: true
  vtc_layout:
    type: participant_folder
    participant_folder_name: "{par_id}"
    rttm_csv_name: rttm.csv
  participant_id_digits: 3
  # Deliberately distinct from CDI's 30.4375; do not harmonize scientific values.
  age_month_denominator: 30.44
  ses_source: mother_education
  minimum_recording_hours_warning: 1.0
  manual_mapping_csv: null

prosody:
  project_root: "."
  project:
    name: HindiBabyNet-ProsodyModel
    random_seed: 42
  paths:
    rttm_root: results/audio/classification/vtc
    audio_root: results/audio/prepared_audio
    # Private input with original_par_id,participant_id columns. Verify it
    # matches results/vocal_stats/private/participant_lookup.csv for THIS cohort;
    # vocal generates that lookup, but no automatic copy/adoption is performed.
    participant_lookup: Data/metadata/participant_lookup.csv
    output_dir: results/prosody
    cache_dir: .local/cache/prosody
  rttm:
    file_pattern: "**/rttm.csv"
    participant_column: uid
    start_column: start_time_s
    duration_column: duration_s
    speaker_column: label
  mapping:
    strict: true
    source_id_column: original_par_id
    participant_id_column: participant_id
  speakers:
    include:
      FEM: adult_female
      MAL: adult_male
      OCH: other_child
  audio:
    extensions: [".wav", ".flac", ".mp3", ".m4a"]
    preferred_extensions: [".wav", ".flac"]
    target_sample_rate: 16000
    mono: true
    end_tolerance_s: 0.05
  pitch:
    method: praat_ac
    speaker_settings:
      FEM:
        pitch_floor_hz: 75.0
        pitch_ceiling_hz: 700.0
      MAL:
        pitch_floor_hz: 50.0
        pitch_ceiling_hz: 400.0
      OCH:
        pitch_floor_hz: 100.0
        pitch_ceiling_hz: 800.0
    time_step_s: 0.01
    lower_percentile: 5.0
    upper_percentile: 95.0
    minimum_voiced_frames: 3
    # INTENTIONAL: uses active 100 Hz to preserve the approved local config's
    # scientific reference. The older prosody example remains 1 Hz, unchanged.
    # These are different semitone origins, not interchangeable defaults.
    semitone_reference_hz: 100.0
    adaptive:
      enabled: true
      level: segment
      lower_multiplier: 0.5
      upper_multiplier: 2.0
      minimum_floor_hz: 40.0
      maximum_ceiling_hz: 1000.0
      fallback_to_first_pass: true
    praat:
      voicing_threshold: 0.45
      octave_cost: 0.01
      octave_jump_cost: 0.35
      voiced_unvoiced_cost: 0.14
  ssl:
    # Scientific model identifiers, not local paths or participant identifiers.
    # Access/downloads and remote revision/weight pinning are separate setup.
    wav2vec2_model: arunps/wav2vec2-home-hindibabynet-ssl
    hubert_model: arunps/hubert-home-hindibabynet-ssl
    wav2vec2_layer: -1
    hubert_layer: -1
    temporal_pooling: mean
    segment_pooling: mean
    minimum_segment_duration_s: 0.1
    maximum_segment_duration_s: null
  pca:
    n_components: 3
    standardize: true
    random_seed: 42
  runtime:
    device: auto
    batch_size: 1
    num_workers: 0
    strict: false
    log_level: INFO
  output:
    final_filename: participant_speaker_acoustic_features.csv
    save_pca_artifacts: true
    save_qc_reports: true

# Native R scientific mapping; cross-project inputs match the producers above.
prosody_stats:
  project_root: "."
  paths:
    acoustic_features: results/prosody/participant_speaker_acoustic_features.csv
    final_master: results/vocal_stats/derived/final_master.csv
    input_long: results/vocal_stats/derived/input_long.csv
    input_output_long: results/vocal_stats/derived/input_output_long.csv
    participant_lookup: Data/metadata/participant_lookup.csv
    metadata_cleaned: Data/metadata/metadata.xlsx
    data_raw: results/prosody_stats/raw
    data_derived: results/prosody_stats/derived
    outputs_models: results/prosody_stats/models
    outputs_tables: results/prosody_stats/tables
    outputs_diagnostics: results/prosody_stats/diagnostics
    outputs_predictions: results/prosody_stats/predictions
    outputs_plots: results/prosody_stats/plots
    outputs_reports: results/prosody_stats/reports
  variables:
    participant_id: participant_id
    source_participant_id: source_participant_id
    speaker: speaker
    age_days: age_days
    age_months: age_months
    age_z: age_z
    age_z2: age_z2
    ses: SES
    ses_num: SES_num
    child_sex: child_sex
    city: Location
    input_count_per_hour: input_count_hour
    input_duration_per_hour: input_duration_hour
    key_child_count_per_hour: key_child_count_hour
    key_child_duration_per_hour: key_child_duration_hour
  speaker_mapping:
    FEM: adult_female
    MAL: adult_male
    OCH: other_child
    adult_female: adult_female
    adult_male: adult_male
    other_child: other_child
  reference_levels:
    speaker: adult_female
    child_sex: female
    city: CNB
  ses_levels: [primary_school, high_school, Intermediate, bachelor, master]
  analysis:
    primary_acoustic_measures:
      - median_F0_Hz
      - robust_pitch_range_Hz
      - wav2vec_PC1
      - wav2vec_PC2
      - wav2vec_PC3
      - hubert_PC1
      - hubert_PC2
      - hubert_PC3
    sensitivity_acoustic_measures:
      - mean_F0_Hz
      - mean_F0_ST
      - median_F0_ST
      - robust_pitch_range_ST
    family_1_age_specification: linear
    family_2_age_specification: linear
    confidence_level: 0.95
    prediction_grid_size: 60
    monte_carlo_draws: 1000
    random_seed: 123
    overwrite_outputs: false
  validation:
    min_age_days: 0
    max_age_days: 3650
    expected_speakers: [adult_female, adult_male, other_child]
    acoustic_numeric_columns:
      - mean_F0_Hz
      - median_F0_Hz
      - sd_F0_Hz
      - robust_pitch_range_Hz
      - mean_F0_ST
      - median_F0_ST
      - sd_F0_ST
      - robust_pitch_range_ST
      - wav2vec_PC1
      - wav2vec_PC2
      - wav2vec_PC3
      - hubert_PC1
      - hubert_PC2
      - hubert_PC3

# CDI is independent of audio. Inputs remain private; metadata is an INPUT
# directory containing the locally retained scientific word_mapping.csv item
# dictionary (not supplied/tracked here). No actual export filenames are listed.
cdi:
  project_root: "."
  paths:
    raw_data: Data/questionnaires
    interim_data: results/cdi/interim
    processed_data: results/cdi/processed
    metadata: Data/cdi_metadata
    outputs: results/cdi
    personal_info: Data/questionnaires_private
  # The native loader discovers .xlsx/.txt using form IDs and column rules;
  # raw_files is not used by that loader. Empty avoids stale filename guards.
  raw_files: {}
  # Questionnaire schema IDs preserved exactly; these are NOT participant IDs.
  # Review for a new study's forms without weakening the native detection rules.
  forms:
    consent_form_id: 539547
    eligibility_form_id: 539591
    background_form_id: 539576
    cdi_8_18_form_id: 539642
    cdi_19_36_form_id: 539644
    contact_form_id: 540031
  analysis:
    age_month_divisor: 30.4375
    younger_questionnaire: "8_18"
    older_questionnaire: "19_36"
    strict_hindi_threshold: 75
    age_discrepancy_flag_months: 2
    younger_age_bins: ["8_10", "11_13", "14_16", "17_18"]
    older_age_bins: ["19_24", "25_30", "31_36"]
  eligibility:
    consent_column: "मैं सहमति देता/देती हूँ कि मेरी गुमनाम जानकारी ऊपर वर्णित परियोजना में उपयोग की जाएगी।"
    mother_tongue_column: "क्या आपके बच्चे की मातृभाषा हिंदी है?"
    preterm_column: "क्या आपका बच्चा प्री-टर्म जन्मा है?"
    impairment_column: "क्या आपके बच्चे को बोलने, सुनने या देखने से संबंधित कोई समस्या है?"
    age_range_column: "क्या आपके बच्चे की आयु 8 से 36 महीने के बीच है?"
    required_mother_tongue_response: true
    allow_preterm: false
    allow_impairment: false
  exposure:
    second_language_column: "यदि लागू हो, तो आपके बच्चे की दूसरी भाषा क्या है?"
    second_language_percent_column: "आपका बच्चा कितने प्रतिशत समय दूसरी भाषा सुनता है?"
    third_language_column: "यदि लागू हो, तो आपके बच्चे की तीसरी भाषा क्या है?"
    third_language_percent_column: "आपका बच्चा कितने प्रतिशत समय तीसरी भाषा सुनता है?"
  age:
    reported_age_column: "बच्चे की उम्र कितने महीनों की है?"
    birthdate_column: birthdate
    child_age_label_column: "बच्चे की आयु"
    completion_date_column: "$created"
    cdi1_min_month: 8
    cdi1_max_month: 18
    cdi2_min_month: 19
    cdi2_max_month: 36
  contact:
    mobile_number_column: "<b>कृपया अपना व्हाट्सएप नंबर प्रदान करें, यदि आपके पास है, अन्यथा सामान्य फोन नंबर प्रदान करें।</b>"
    email_column: "<b>Email address (ईमेल)</b>"
  education:
    mother_education_column: "माता की वर्तमान शिक्षा स्तर:"
    father_education_column: "पिता की वर्तमान शिक्षा स्तर:"
    analysis_groups: [Primary, Secondary, College, Graduate, Other/unknown]
  completeness:
    minimum_present_ratio: 0.8
    maximum_trailing_blank_run: 25
  # Processed outputs can include contacts/crosswalks: ALL results stay private.
  outputs:
    qc_dir: results/cdi/tables/qc
    cdi1_tables_dir: results/cdi/tables/cdi1
    cdi2_tables_dir: results/cdi/tables/cdi2
    combined_tables_dir: results/cdi/tables/combined
    cdi1_comprehension_figures_dir: results/cdi/figures/cdi1/comprehension
    cdi1_production_figures_dir: results/cdi/figures/cdi1/production
    cdi1_items_figures_dir: results/cdi/figures/cdi1/items
    cdi1_categories_figures_dir: results/cdi/figures/cdi1/categories
    cdi2_production_figures_dir: results/cdi/figures/cdi2/production
    cdi2_items_figures_dir: results/cdi/figures/cdi2/items
    cdi2_categories_figures_dir: results/cdi/figures/cdi2/categories
    combined_figures_dir: results/cdi/figures/combined
    qc_figures_dir: results/cdi/figures/qc
  form_detection_rules:
    consent:
      - "मैं सहमति देता/देती हूँ कि मेरी गुमनाम जानकारी ऊपर वर्णित परियोजना में उपयोग की जाएगी।"
      - fill_date
    eligibility:
      - "क्या आपके बच्चे की मातृभाषा हिंदी है?"
      - "क्या आपका बच्चा प्री-टर्म जन्मा है?"
      - Reference ID
    background:
      - "बच्चे की उम्र कितने महीनों की है?"
      - birthdate
      - SUBMISSION_REFERENCE
      - "$forwarded_to_form"
    cdi_8_18:
      - "केवल समझता/समझती है"
      - "समझता/समझती है और कहता/कहती है"
      - "इश/आह/उह (दर्द)"
    cdi_19_36:
      - "कहता/कहती है"
      - "इश/आह/उह (दर्द)"
      - "क्रिंग क्रिंग (साइकिल का शोर घंटी)"
    contact:
      - "<b>कृपया अपना व्हाट्सएप नंबर प्रदान करें, यदि आपके पास है, अन्यथा सामान्य फोन नंबर प्रदान करें।</b>"
      - "<b>Email address (ईमेल)</b>"
      - Reference ID

# Operation and safety limits (root launcher; direct native commands differ):
# all runs only enabled workflows, in dependency order; it neither enables
# dependencies nor substitutes backends. Preexisting VTC inputs may be supplied
# explicitly, with matching audio timebase, participant mapping and cohort.
# --config wins over HBN_CONFIG_PATH, otherwise config.local.yaml is used.
# check / --dry-run are read-only; setup explicitly syncs enabled Python projects
# with frozen locks. R packages, FFmpeg, VTC and SSL dependencies need setup too.
# Reports and interactive annotation are explicit stages, never automatic.
#
# Resume is successful WHOLE-stage reuse, not participant/cache recovery. Matching
# ownership in .local/runs/ plus input/config/code/output fingerprints is required.
# Unowned, changed or incomplete occupied outputs are refused: choose fresh write
# roots (including cache/log/artifact roots); --no-resume does not allow overwrite.
# Native --resume passthrough is refused; there is no --force. Separate native
# stages sharing write roots may be refused; prefer the native full workflow.
# Manifest-referenced audio paths/membership are not decoded by the launcher,
# so manifest-driven audio stages are not auto-resumed. Audio fingerprints use
# size+mtime_ns, not byte hashes; remote HF revisions/weights, installed R/tool
# versions and absent LFS contents are not guaranteed pinned. No full scientific
# equivalence/reproducibility claim follows from a successful ownership record.
# After interruption inspect .local/runs/active.lock before manual removal;
# do not run overlapping configs concurrently. This is not a filesystem sandbox.