# HindiBabyNet configuration
#
# Copy this file to config.yaml and change the paths. config.yaml stays on your
# computer and is not uploaded to GitHub.
#
# The research data does not need to be inside this project folder. It can be on
# another disk, an external hard drive, a network folder or in Ubuntu (WSL).
# A relative path starts from the folder where config.yaml is saved.

# Main data folder. All other folders have a default place inside it:
#
#   raw/audio/                    raw recordings: <participant>/<YYYYMMDD>/*.WAV
#   raw/cdi/                      CDI questionnaire exports and word_mapping.csv
#   raw/metadata/                 metadata_cleaned.xlsx, participant_lookup.csv
#   derived/prepared-audio/       one prepared WAV file per participant
#   derived/vtc-classification/   VTC speaker classification results
#   derived/xgb-classification/   XGBoost speaker classification results
#   derived/prosody-features/     acoustic and prosodic features
#   derived/statistical-data/     prepared datasets for the audio statistics
#   derived/textgrids/            optional: Praat TextGrid files
#   derived/manual-annotations/   optional: manual speaker labels
#   results/                      results of cdi, audio-stats and prosody-stats
#   cache/                        temporary files
data_dir: ../HindiBabyNet-data

# Use this part only if a folder is stored in another place.
# Remove the "#" in front of the line and write your own path.
paths:
  # raw_audio: D:/HindiBabyNet/RawAudioData
  # raw_cdi: D:/HindiBabyNet/cdi-raw
  # word_mapping: D:/HindiBabyNet/cdi-raw/word_mapping.csv
  # metadata: D:/HindiBabyNet/metadata
  # prepared_audio: D:/HindiBabyNet/prepared-audio
  # vtc: D:/HindiBabyNet/vtc-classification
  # xgb: D:/HindiBabyNet/xgb-classification
  # prosody_features: D:/HindiBabyNet/prosody-features
  # statistical_data: D:/HindiBabyNet/statistical-data
  # textgrids: D:/HindiBabyNet/textgrids
  # annotations: D:/HindiBabyNet/manual-annotations
  # results: D:/HindiBabyNet/results
  # cache: D:/HindiBabyNet/cache

# Path examples
#   Windows:        D:/HindiBabyNet/RawAudioData
#   Ubuntu (WSL):   /home/yourname/hindinet_data/RawAudioData
#   Network folder: //server/share/HindiBabyNet/RawAudioData
#
# A Windows path such as C:/data is also understood in Ubuntu (it becomes
# /mnt/c/data). An Ubuntu path such as /home/yourname/data is also understood
# in Windows and RStudio. If your Ubuntu is not named "Ubuntu", write its name:
# wsl_distro: Ubuntu-22.04

# Speaker classification with VTC (runs in Ubuntu).
audio:
  vtc_repo: ~/VTC      # folder where VTC is installed
  vtc_device: cpu      # cpu or cuda
