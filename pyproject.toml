[project]
name = "hindibabynet-launcher"
version = "0.1.0"
description = "Thin launcher for the independent HindiBabyNet workflows"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=7,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]