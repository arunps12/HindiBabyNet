# Settings of the audio preparation and the speaker classification.
# The data folders are not written here: they are in config.yaml in the project root.
# Do not change these values for an existing study.

raw_audio:
  extensions: [".wav", ".WAV"]
  date_format: "%Y%m%d"
  # How the raw recordings are organised: auto, participants or files.
  # auto finds participant folders, date folders and single files by itself.
  structure: auto

audio_preparation:
  # true: the WAV files of one participant are joined to one file.
  # false: every WAV file is prepared as its own file.
  join_multiple_files: true
  # first: only the first recording day of a participant. all: all days.
  recording_days: first
  combine_gap_sec: 0.0
  resample: true
  target_sr: 16000
  convert_to_mono: true
  normalize: true
  target_peak_dbfs: -1.0

xgb:
  class_names: ["adult_male", "adult_female", "child", "background"]
  egemaps_dim: 88

  # Voice activity detection (WebRTC VAD). It cuts the recording into speech chunks.
  vad:
    # 0 to 3. A higher value removes more sound that is not clear speech.
    aggressiveness: 1
    # Length of one VAD frame: 10, 20 or 30 ms.
    frame_ms: 30
    # Chunks shorter than this are not used.
    min_region_ms: 90
    # A pause of this length or longer ends a chunk. Shorter pauses stay inside the chunk.
    # With frames of 60 ms, the value 60 means: every frame without speech ends a chunk.
    min_silence_ms: 60

  segmentation:
    # true: chunks with a pause up to merge_gap_sec are joined before the classification.
    merge_before_classification: false
    # true: after the classification, chunks that follow each other, have the same class
    # and a pause up to merge_gap_sec are merged in a second table.
    merge_after_classification: true
    merge_gap_sec: 0.3

  classification:
    win_sec: 1.0
    hop_sec: 0.5

  # Not used at present: speaker diarization (see audio/src/hindibabynet_audio/xgb.py).
  # To use it again, remove the "#" here, in xgb.py and in audio/pyproject.toml.
  # diarization:
  #   model: "pyannote/speaker-diarization-3.1"
  #   chunk_sec: 900.0
  #   overlap_sec: 10.0
  #   min_speakers: 2
  #   max_speakers: 4
  # segmentation:
  #   min_segment_sec: 0.2

vtc:
  batch_size: 32

annotation:
  n_segments_per_participant: 50
  random_seed: 42
  labels:
    adult_female: 1
    adult_male: 2
    key_child: 3
    other_child: 4
    unclear: 5
    noise: 6

textgrid:
  tiers:
    - adult_female
    - adult_male
    - key_child
    - other_child
