[project]
name = "hindibabynet-audio"
version = "0.2.0"
description = "Audio preparation and speaker classification (VTC or XGBoost) for the HindiBabyNet project"
requires-python = ">=3.10,<3.13"
dependencies = [
    "hbn-paths",
    "numpy>=2.2.6",
    "pandas>=2.0,<2.3",
    "praatio>=6.2.2",
    "pyarrow>=14,<24",
    "pyyaml>=6,<7",
    "scipy>=1.15.3",
    "soundfile>=0.12,<1",
]

[project.optional-dependencies]
xgb = [
    "huggingface-hub<0.21",
    "joblib>=1.5.3",
    "matplotlib>=3.7,<3.9",
    "opensmile>=2.6.0",
    "pyannote-audio>=3.4.0",
    "python-dotenv>=1.2.1",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "tqdm>=4.64,<5",
    # Ready-built version of webrtcvad (same code, imported as webrtcvad). No C compiler is needed.
    "webrtcvad-wheels>=2.0.10,<3",
    "xgboost>=3.1.3",
]

[project.scripts]
hbn-audio = "hindibabynet_audio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hindibabynet_audio*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=7,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
hbn-paths = { path = "../shared", editable = true }
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
