[project]
name = "hindibabynet-cdi"
version = "0.2.0"
description = "Processes the Hindi CDI questionnaires of the HindiBabyNet project"
requires-python = ">=3.10,<3.13"
dependencies = [
    "hbn-paths",
    "numpy>=1.24,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.0,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
hbn-cdi = "hindibabynet_cdi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hindibabynet_cdi*"]

[dependency-groups]
dev = ["pytest>=7,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.uv.sources]
hbn-paths = { path = "../shared", editable = true }
